name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # One toolchain for CI and releases (release.yml pins the same), so a lint
  # never passes in one and fails in the other.
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  # Default features only: hermetic, no native library, no model, no network.
  # The `sherpa` build is the owner gate and runs in release.yml.
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Refuse a hand-edited protocol export
        # protocol/ is the daemon's export. A change here must come from
        # re-vendoring it, in the same change as the daemon's bump.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if git diff --name-only "origin/${BASE_REF}...HEAD" -- protocol/ | grep -q .; then
            echo "::error::protocol/ is vendored from the fermix daemon and must not be edited here."
            echo "Re-vendor the daemon's export instead, and say so in the PR body."
            exit 1
          fi
