name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (dry run; no release is published)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ci.yml pins the same toolchain.
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  # Every released binary carries the real engine. This is also the first
  # compile of the `sherpa` feature — CI runs default features only.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # No macos-x86_64 (matches fermix-meetbot): GitHub retired its Intel macOS
      # runners, so a job for one queues and never starts, and `publish` needs
      # every build. That is how v0.1.0 shipped without its Linux binaries.
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            asset: macos-aarch64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            asset: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: linux-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install the toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
          rustc --version && cargo --version

      - name: Stage the embedded Silero VAD model
        run: scripts/fetch-silero-vad.sh

      - name: Stage the pinned sherpa-onnx native library
        run: scripts/fetch-sherpa-onnx.sh ${{ matrix.target }} "$RUNNER_TEMP/sherpa-onnx"

      - name: Build
        env:
          # sherpa-onnx-sys copies the archive staged above from this folder,
          # and with it set never downloads one.
          SHERPA_ONNX_ARCHIVE_DIR: ${{ runner.temp }}/sherpa-onnx
        run: cargo build --release --locked --features sherpa --target ${{ matrix.target }}

      - name: Verify the binary answers
        run: ./target/${{ matrix.target }}/release/fermix-stt --version

      - name: Sign and notarize (macOS)
        if: startsWith(matrix.runner, 'macos')
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          BINARY: target/${{ matrix.target }}/release/fermix-stt
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12}" ] || [ -z "${SIGNING_IDENTITY}" ]; then
            echo "::warning title=Unsigned build::MACOS_CERTIFICATE_P12 / MACOS_SIGNING_IDENTITY are not set. Publishing an UNSIGNED, UNNOTARIZED ${{ matrix.asset }} binary. Gatekeeper will quarantine it on download. Set the signing secrets and re-run this release."
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

          codesign --force --timestamp --options runtime \
            --sign "$SIGNING_IDENTITY" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"
          # Nothing after this signs (notarization uses the API key), so the
          # identity leaves the runner before the steps that follow run.
          security delete-keychain "$keychain"

          if [ -z "${NOTARY_KEY}" ] || [ -z "${NOTARY_KEY_ID}" ] || [ -z "${NOTARY_ISSUER_ID}" ]; then
            echo "::warning title=Not notarized::The binary is signed but MACOS_NOTARY_API_* are not set, so it was not notarized. Gatekeeper will still warn on first launch."
            exit 0
          fi

          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$BINARY" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"
          # A bare executable cannot be stapled; Gatekeeper checks the notary
          # service online. Nothing further to do here.

      - name: Package
        id: package
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          name="fermix-stt-${version}-${ASSET}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/fermix-stt" "dist/${name}/fermix-stt"
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          # The bare binary is what the fermix daemon's SidecarInstaller
          # downloads (it pins a per-target URL + the binary's sha256 and
          # execs it directly). The tarball is the human-download convenience.
          bare="fermix-stt-${ASSET}"
          cp "target/${{ matrix.target }}/release/fermix-stt" "dist/${bare}"
          if command -v sha256sum >/dev/null 2>&1; then
            hash() { sha256sum "$1"; }
          else
            hash() { shasum -a 256 "$1"; }
          fi
          (cd dist && hash "${name}.tar.gz" > "${name}.tar.gz.sha256")
          (cd dist && hash "${bare}" > "${bare}.sha256")
          cat "dist/${bare}.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/fermix-stt-${{ matrix.asset }}
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Compose the release notes
        run: |
          set -euo pipefail
          {
            echo "Local speech-to-text sidecar for the Fermix daemon."
            echo
            echo "Wire \`protocol_version\` 1. See CHANGELOG.md for details."
            echo
            echo "## Pinning this release in fermix"
            echo
            echo "fermix's SidecarInstaller pins a per-target **bare binary** URL"
            echo "(\`fermix-stt-<target>\`) plus that binary's sha256, and the daemon"
            echo "downloads and execs it directly. Take the \`fermix-stt-<target>\`"
            echo "values from \`SHA256SUMS\` below — not the tarball's — and land them"
            echo "in the fermix repo as a normal PR; never hand-write a checksum."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md

      # Creates the release or updates it (matches fermix-meetbot), so a
      # hand-created release does not fail the job. Updating replaces assets of
      # the same name, and a rebuilt binary does not hash the same: never re-run
      # this for a tag fermix already pins. Cut a new version instead.
      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/fermix-stt-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
